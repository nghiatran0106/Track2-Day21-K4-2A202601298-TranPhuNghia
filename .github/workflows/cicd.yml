name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

# Vung AWS chua S3 bucket. Doi gia tri nay neu bucket cua ban nam o vung khac.
env:
  AWS_DEFAULT_REGION: us-east-1

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        # TODO 1: Viet lenh de chay pytest tren thu muc tests/ voi co -v
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc S3, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        # TODO 2: Tach access key / secret key tu secret STORAGE_CREDENTIALS
        #         va set thanh bien moi truong chuan cua AWS. Ca DVC (qua s3fs)
        #         lan boto3 deu tu doc hai bien nay, khong can file credentials.
        #
        # GitHub chi che giau nguyen van chuoi JSON trong log, KHONG tu dong che
        # cac truong ben trong no. Vi vay phai goi ::add-mask:: cho tung khoa.
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          ACCESS_KEY=$(python -c "import json, os; print(json.loads(os.environ['STORAGE_CREDENTIALS'])['aws_access_key_id'])")
          SECRET_KEY=$(python -c "import json, os; print(json.loads(os.environ['STORAGE_CREDENTIALS'])['aws_secret_access_key'])")

          echo "::add-mask::$ACCESS_KEY"
          echo "::add-mask::$SECRET_KEY"

          echo "AWS_ACCESS_KEY_ID=$ACCESS_KEY" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$SECRET_KEY" >> $GITHUB_ENV

      - name: Pull data with DVC
        # TODO 3: Pull cac file du lieu can thiet tu S3 bang lenh dvc pull.
        #         Chi pull train_batch1.csv va holdout.csv (khong can train_batch2.csv).
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        # TODO 4: Doc gia tri "f1_score" tu outputs/report.json bang Python inline.
        #         Set ket qua thanh output "f1" de job quality-gate co the doc.
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT
          echo "f1_score cua lan chay nay: $F1"

      - name: Upload model to Cloud Storage
        # TODO 5: Dung boto3 de upload models/model.joblib len
        #         s3://<bucket>/artifacts/current/model.joblib
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import os
          import boto3

          bucket_name = os.environ["ARTIFACT_BUCKET"]
          key = "artifacts/current/model.joblib"

          s3 = boto3.client("s3")
          s3.upload_file("models/model.joblib", bucket_name, key)
          print(f"Da upload model len s3://{bucket_name}/{key}")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  #
  # Luu y: nguong o day dat tren f1_score chu KHONG phai accuracy. Bo du lieu
  # Adult co ty le lop 75/25, nen mot mo hinh doan bua "thu nhap thap" cho moi
  # mau da dat accuracy 0.75 ma hoan toan vo dung.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        # TODO 6: Doc f1 tu output cua job train.
        #         GitHub Actions outputs luon la CHUOI, nen bat buoc phai float()
        #         truoc khi so sanh, neu khong se so sanh sai theo thu tu tu dien.
        env:
          F1: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PYEOF'
          import os

          THRESHOLD = 0.65
          f1 = float(os.environ["F1"])

          if f1 < THRESHOLD:
              raise SystemExit(
                  f"FAILED: f1_score {f1:.4f} < {THRESHOLD}. Huy trien khai."
              )

          print(f"PASSED: f1_score {f1:.4f} >= {THRESHOLD}. Dang trien khai model.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len EC2 qua SSH.
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # TODO 7: Restart service income-api tren EC2.
            # Restart lam serve.py chay lai tu dau, keo theo download_model()
            # duoc goi lai va model moi nhat duoc nap vao bo nho.
            sudo systemctl restart income-api

            # TODO 8: Cho server san sang roi goi curl /healthz de xac nhan.
            # Thu lai toi da 10 lan (moi lan cach 3 giay) truoc khi bao that bai.
            for i in $(seq 1 10); do
              if curl -sf http://localhost:8080/healthz; then
                echo ""
                echo "Health check passed sau $i lan thu."
                exit 0
              fi
              echo "Server chua san sang, thu lai lan $i/10..."
              sleep 3
            done

            echo "Health check that bai. Xem log: sudo journalctl -u income-api -n 50"
            exit 1
